<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Giá Thị Trường - VNINDEX vs P/E (Apache ECharts)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121418;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1a1d24;
            border: 1px solid #2d3139;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }
        .info-icon {
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }
        .timeframe-select {
            background-color: #242933;
            color: #e2e8f0;
            border: 1px solid #3b4252;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }
        .timeframe-select:hover {
            border-color: #ff9800;
        }
        #echarts-container {
            width: 100%;
            height: 480px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="title-group">
                <span class="title">Định giá theo P/E</span>
                <span class="info-icon" title="Tương quan giữa điểm số VNINDEX và bội số định giá P/E toàn thị trường">ⓘ</span>
            </div>
            <select id="timeframe-select" class="timeframe-select">
                <option value="1m">1 tháng</option>
                <option value="3m" selected>3 tháng</option>
                <option value="1y">1 năm</option>
            </select>
        </div>

        <div id="echarts-container"></div>
    </div>

    <script>
        // 1. Mock Data Generator (Tạo dữ liệu thực tế 1 năm: Ngày, VNINDEX, P/E)
        function generateValuationMockData(totalDays = 365) {
            const data = [];
            let date = new Date(Date.UTC(2025, 8, 1));
            let vnindex = 1200;
            let pe = 13.2;

            for (let i = 0; i < totalDays; i++) {
                // Bỏ qua T7 và CN
                if (date.getUTCDay() === 6) date.setUTCDate(date.getUTCDate() + 2);
                if (date.getUTCDay() === 0) date.setUTCDate(date.getUTCDate() + 1);

                const dateStr = date.toISOString().split('T')[0];
                
                // Dao động ngẫu nhiên có tương quan cùng chiều giữa điểm số và P/E
                const deltaIndex = (Math.random() - 0.47) * 16;
                vnindex = Math.max(1000, Math.min(1950, vnindex + deltaIndex));
                
                const deltaPE = (deltaIndex / 100) + (Math.random() - 0.5) * 0.08;
                pe = Math.max(10.0, Math.min(19.5, pe + deltaPE));

                data.push({
                    date: dateStr,
                    vnindex: Math.round(vnindex),
                    pe: parseFloat(pe.toFixed(1))
                });

                date.setUTCDate(date.getUTCDate() + 1);
            }
            return data;
        }

        const fullDataset = generateValuationMockData(260); // Khoảng 1 năm giao dịch

        // 2. Khởi tạo ECharts
        const chartDom = document.getElementById('echarts-container');
        const myChart = echarts.init(chartDom);

        // 3. Hàm render cấu hình Chart theo mốc thời gian
        function renderChart(timeframe) {
            let sliceCount = 65; // Mặc định 3 tháng
            if (timeframe === '1m') sliceCount = 22;
            if (timeframe === '1y') sliceCount = 260;

            const filteredData = fullDataset.slice(-sliceCount);
            const dates = filteredData.map(d => d.date);
            const vnindexValues = filteredData.map(d => d.vnindex);
            const peValues = filteredData.map(d => d.pe);

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        lineStyle: { color: '#64748b', type: 'dashed' }
                    },
                    backgroundColor: 'rgba(26, 29, 36, 0.95)',
                    borderColor: '#3b4252',
                    textStyle: { color: '#f8fafc' },
                    formatter: function(params) {
                        let html = `<b>${params[0].axisValue}</b><br/>`;
                        params.forEach(item => {
                            const marker = `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:${item.color};"></span>`;
                            const unit = item.seriesIndex === 0 ? ' điểm' : ' lần';
                            html += `${marker} ${item.seriesName}: <b>${item.value}${unit}</b><br/>`;
                        });
                        return html;
                    }
                },
                legend: {
                    data: ['VNINDEX (điểm, cột trái)', 'P/E (lần, cột phải)'],
                    bottom: 0,
                    textStyle: { color: '#cbd5e1', fontSize: 12 },
                    icon: 'circle'
                },
                grid: {
                    left: '3%',
                    right: '3%',
                    top: '12%',
                    bottom: '12%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLine: { lineStyle: { color: '#334155' } },
                    axisLabel: {
                        color: '#94a3b8',
                        formatter: function(val) {
                            return val.substring(5); // Hiển thị MM-DD
                        }
                    },
                    axisTick: { show: false }
                },
                yAxis: [
                    // Trục Y bên trái: VNINDEX (Số nguyên)
                    {
                        type: 'value',
                        name: 'VNINDEX',
                        nameTextStyle: { color: '#ff9800', align: 'right' },
                        position: 'left',
                        min: function(val) { return Math.floor(val.min / 50) * 50; },
                        axisLabel: {
                            color: '#ff9800',
                            formatter: '{value}'
                        },
                        splitLine: {
                            lineStyle: { color: 'rgba(51, 65, 85, 0.4)', type: 'dashed' }
                        }
                    },
                    // Trục Y bên phải: P/E (Số thập phân 1 chữ số)
                    {
                        type: 'value',
                        name: 'P/E',
                        nameTextStyle: { color: '#4caf50', align: 'left' },
                        position: 'right',
                        min: function(val) { return parseFloat((val.min - 0.5).toFixed(1)); },
                        axisLabel: {
                            color: '#4caf50',
                            formatter: function(val) { return val.toFixed(1); }
                        },
                        splitLine: { show: false }
                    }
                ],
                series: [
                    {
                        name: 'VNINDEX (điểm, cột trái)',
                        type: 'line',
                        yAxisIndex: 0,
                        data: vnindexValues,
                        smooth: 0.2,
                        showSymbol: false,
                        itemStyle: { color: '#ff9800' },
                        lineStyle: { width: 2, color: '#ff9800' }
                    },
                    {
                        name: 'P/E (lần, cột phải)',
                        type: 'line',
                        yAxisIndex: 1,
                        data: peValues,
                        smooth: 0.2,
                        showSymbol: false,
                        itemStyle: { color: '#4caf50' },
                        lineStyle: { width: 2, color: '#4caf50' }
                    }
                ]
            };

            myChart.setOption(option, true);
        }

        // 4. Lắng nghe sự kiện đổi mốc thời gian (1 tháng, 3 tháng, 1 năm)
        document.getElementById('timeframe-select').addEventListener('change', (e) => {
            renderChart(e.target.value);
        });

        // Khởi chạy ban đầu
        renderChart('3m');

        // Tự động thích ứng kích thước màn hình
        window.addEventListener('resize', () => {
            myChart.resize();
        });
    </script>
</body>
</html>
