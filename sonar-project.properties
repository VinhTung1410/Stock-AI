sonar.projectKey=VinhTung1410_Stock-AI
sonar.organization=vinhtung1410

# Source & Test configuration
sonar.sources=.
sonar.tests=tests

# Exclusions to prevent noise and optimize analysis speed
sonar.exclusions=tests/**,docs/**,.venv/**,scratch/**,**/*.md,**/*.json
sonar.sourceEncoding=UTF-8

# Quantitative Test Coverage Report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
