sonar.projectKey=VinhTung1410_Stock-AI
sonar.organization=vinhtung1410

# Source & Test configuration
sonar.sources=.
sonar.tests=tests

# Exclusions to prevent noise and optimize analysis speed
sonar.exclusions=tests/**,docs/**,.venv/**,scratch/**,**/*.md,**/*.json
sonar.sourceEncoding=UTF-8

# Coverage configuration: Exclude UI and background runners from mandatory unit coverage
sonar.coverage.exclusions=app.py,tabs/**,components/**,run_cloud.py,trading_bot.py,discord_alerts.py,db_manager.py
sonar.python.coverage.reportPaths=coverage.xml
