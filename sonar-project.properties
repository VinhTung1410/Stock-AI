sonar.projectKey=VinhTung1410_Stock-AI
sonar.organization=vinhtung1410

# Source & Test configuration
sonar.sources=.
sonar.tests=tests

# Exclusions to prevent noise and optimize analysis speed
sonar.exclusions=tests/**,docs/**,.venv/**,scratch/**,**/*.md,**/*.json
sonar.sourceEncoding=UTF-8

# Coverage configuration: Exclude AI LLM prompts, network I/O, UI, and background runners from mandatory unit coverage
# (Strict test coverage is focused on deterministic quantitative calculation engines)
sonar.coverage.exclusions=ai_analyst.py,data_engine.py,app.py,tabs/**,components/**,run_cloud.py,trading_bot.py,discord_alerts.py,db_manager.py
sonar.python.coverage.reportPaths=coverage.xml
